name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; a main run is not, since
  # it is the one that publishes a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  javascript:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  android:
    name: Compile the Android app
    needs: javascript
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Its default package list includes the obsolete "tools" package,
          # which Google has removed from the SDK repository — sdkmanager then
          # exits non-zero and the whole job dies before Gradle starts. We only
          # need the licences accepted and the SDK on PATH; Gradle fetches the
          # platform and build-tools it wants by itself.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Autolinking and the TurboModule codegen both read node_modules, so the
      # JavaScript dependencies have to be in place before Gradle runs.
      - name: Install dependencies
        run: npm ci

      # Release rather than debug, for two reasons: a debug APK leaves the
      # JavaScript out and asks Metro for it at launch, so it cannot run on
      # its own phone; and this variant compiles the same Kotlin and codegen
      # output, so it is still the check that the native module builds.
      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename the APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/KtmConnect.apk

      # Confirms the bundler actually ran: without index.android.bundle inside,
      # the app launches to a red screen asking for Metro.
      - name: Check the JavaScript bundle is packaged
        run: |
          unzip -l android/app/build/outputs/apk/release/KtmConnect.apk \
            | grep -q 'assets/index.android.bundle' \
            || { echo "::error::index.android.bundle is missing from the APK"; exit 1; }

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: KtmConnect-apk
          path: android/app/build/outputs/apk/release/KtmConnect.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish a release
    needs: android
    # Only on main: a release per pull request would bury the real ones.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    # Write access is confined to this job, which is the only one that needs it.
    permissions:
      contents: write

    steps:
      - name: Download the APK
        uses: actions/download-artifact@v7
        with:
          name: KtmConnect-apk
          path: apks

      - name: Verify downloaded files
        run: |
          echo "Downloaded APKs:"
          find apks -type f -name "*.apk" -ls

      # Tagged main-<n> rather than build-<n>: each workflow has its own run
      # number, so sharing a prefix with the manual Build APK workflow would
      # eventually collide on a tag.
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ github.run_number }}
          name: Main build ${{ github.run_number }}
          prerelease: true
          body: |
            Built from `${{ github.sha }}` on merge to main.

            - `KtmConnect.apk` — install and run, no computer needed

            Marked as a pre-release because it is signed with React Native's
            debug keystore. A real keystore is needed before publishing
            anywhere.
          files: |
            apks/KtmConnect.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
